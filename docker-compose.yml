services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_VERSION: baseline-lr-v1

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
